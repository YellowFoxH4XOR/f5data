[project]
name = "f5scraper"
version = "0.1.0"
description = "Scrapes F5 (my.f5.com) Quarterly Security Notifications + EOL/lifecycle data into JSON"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
]

[project.scripts]
f5scraper = "f5scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f5scraper"]
