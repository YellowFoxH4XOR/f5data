[project]
name = "f5scraper"
version = "0.1.0"
description = "Collects F5 security, lifecycle, knowledge-base, and technical documentation into structured data"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
]

[project.scripts]
f5scraper = "f5scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f5scraper"]
