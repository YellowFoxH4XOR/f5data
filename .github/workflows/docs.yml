name: Refresh F5 technical documentation

on:
  schedule:
    - cron: "0 5 * * 0"       # weekly Sunday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f5-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Collect technical documentation
        run: python -u -m f5scraper.cli docs --throttle 0.5
      - name: Run summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("data/output/docs.json").read_text())
          crawl = json.loads(Path("data/output/docs/crawl.json").read_text())
          print("## F5 technical documentation")
          print(f"\nDocuments: **{index['document_count']}**")
          print("\n| Source | Documents |\n|---|---|")
          for source, details in index["sources"].items():
              print(f"| {source} | {details['document_count']} |")
          print(f"\nPending URLs: {len(crawl['pending'])}; failed pages: {len(crawl['failed_pages'])}; failed images: {len(crawl['failed_images'])}.")
          if not crawl["complete"]:
              print("\nSome sources were incomplete; existing documents were retained. See docs/crawl.json for URLs and errors.")
          PY
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/docs data/output/docs.json
          if git diff --cached --quiet; then
            echo "No documentation changes this run." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "data: refresh F5 technical docs ($(date -u +%Y-%m-%d))"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 5 ]; then echo "push failed after 5 attempts"; exit 1; fi
              sleep $((attempt * 15))
            done
          fi
