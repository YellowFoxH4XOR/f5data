util diadb(1)						BIG-IP TMSH Manual					     util diadb(1)

NAME
       diadb - Run the diadb command to display, filter or delete dia persistence entries.

MODULE
       util

SYNTAX
	run util diadb <option>
	Options:
	-h, --help
	-v, --verbose
	-r, --router <diarouter-profile>
	-k, --key <key>
	-d, --delete --router <diarouter-profile> --key <key> --type <type> --ipproto <proto>
	-e, --erase

DESCRIPTION
       The diadb utility allows users to display, filter or delete Diameter persistence entries.

EXAMPLES
       run util diadb

       Shows all Diameter persistence entries.	The output displays persistence type, key, originator, destination, timeout,
       protocol.  The key is prefixed with persistence type i.e. 'A' for AVP persistence or 'O' for custom persistence.  The
       timeout value displayed is in seconds.

       run util diadb -h run util diadb --help Shows the help.

       run util diadb -v run util diadb --verbose The output displays the destination transport configuration and pool name in
       addition to the default values.	The transport name is prefixed with the transport transport type, 'tc:' for transport
       config or 'vs:' for virtual server

       run util diadb -r /Common/diarouter-profile run util diadb --router /Common/diarouter-profile

       Shows Diameter persistence entries for the routing instance 'diarouter-profile' parameter.

       run util diadb -k 3-11768@10.10.10.8 run util diadb --key 3-11768@10.10.10.8

       Shows the Diameter persist record for key 3-11768@10.10.10.8.

       run util diadb -d -r /Common/diarouter-profile -k key1 -t A -p TCP run util diadb --delete --router
       /Common/diarouter-profile --key key1 --type A -ipproto TCP

       Delete the Diameter persist record matching key 'key1', type 'A' (AVP), ip-proto 'TCP' and router profile
       '/Common/diarouter-profile'.  The type value is either 'A' for AVP persistence or 'O' for custom persistence.  The ipproto
       value is either TCP, SCTP.

       run util diadb -e run util diadb --erase

       Deletes all Diameter persist records.

SEE ALSO
       run, tmsh
