util sipdb(1)						BIG-IP TMSH Manual					     util sipdb(1)

NAME
       sipdb - Run the sipdb command to view SIP persistence entries.

MODULE
       util

SYNTAX
	run util sipdb <option>
	Options:
	-h, --help
	-v, --verbose
	-r, --router <siprouter-profile>
	-k, --key <key>
	-d, --delete -r, --router <siprouter-profile> -k, --key <key> -t, --type <type> -p, --ipproto <proto>

DESCRIPTION
       The sipdb utility allows users to view or delete SIP persistence entries.

EXAMPLES
       run util sipdb

       Shows all SIP persistence entries.  The output displays key, type, originator, destination, timeout, protocol.  The key is
       prefixed with persistence type i.e. 'C' for call-id persistence, 'S' for source address persistence, 'O' for custom
       persistence.  The timeout value displayed is in seconds.

       run util sipdb -h run util sipdb --help Shows the help.

       run util sipdb -v run util sipdb --verbose The output displays the destination transport configuration and pool name in
       addition to the default values.	The transport name is prefixed with the transport transport type, 'tc:' for transport
       config or 'vs:' for virtual server

       run util sipdb -r /Common/siprouter-profile run util sipdb --router /Common/siprouter-profile

       Shows SIP persistence entries for the routing instance 'siprouter-profile' parameter.

       run util sipdb -k 3-11768@10.10.10.8 run util sipdb --key 3-11768@10.10.10.8

       Shows the SIP persist record for key 3-11768@10.10.10.8.

       run util sipdb -d -r /Common/siprouter-profile -k key1 -t C -p UDP run util sipdb --delete --router
       /Common/siprouter-profile --key key1 --type C -ipproto UDP

       Delete the SIP persist record matching key 'key1', type 'C' (call-ID), ip-proto 'UDP' and router profile
       '/Common/siprouter-profile'.  The type value is either 'C' for call id persistence, 'S' for source address persistence or
       'O' for custom persistence.  The ipproto value is either UDP or TCP.

SEE ALSO
       run, tmsh
